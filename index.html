    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.20);
            text-align: center;
        }

        img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        h3 {
            font-weight: 400;
            color: #666;
            margin-bottom: 30px;
        }

        .search-form form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        select, input[type="text"], input[type="submit"] {
            padding: 10px;
            font-size: 1em;
            border-radius: 6px;
            border: 1px solid #ccc;
            transition: all 0.2s ease-in-out;
        }

        select {
            width: 150px;
            background-color: #f0f8ff;
            border-color: #4CAF50;
            cursor: pointer;
        }

        input[type="text"] {
            width: 60%;
            min-width: 200px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            width: auto; 
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .links {
            margin-top: 30px;
            text-align: left;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link-item {
            margin: 6px 12px;
            display: flex;
            align-items: center;
            background-color: #f4f4f4;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
        }

        .link-item a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
            margin-right: 8px;
            transition: color 0.2s ease;
        }

        .link-item a:hover {
            color: #388e3c;
            text-decoration: underline;
        }

        .remove-button {
            background-color: #ff5f5f;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: none; 
        }

        .remove-button:hover {
            background-color: #e04e4e;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #888;
            line-height: 1.6;
        }

	.add-link-button-container {
   	     text-align: center; 
             margin-top: 20px; 
         }

	.add-link-button {
    	    background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 20px; 
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease-in-out;
	}

	.add-link-button:hover {
            background-color: #45a049;
	}

	.add-link-button i {
   	    font-size: 20px; 
    	    margin: 0; 
	}

        .add-link-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .add-link-popup-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
        }

        .add-link-popup input {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add-link-popup button {
            padding: 10px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-link-popup button:hover {
            background-color: #45a049;
        }

        @media (max-width: 500px) {
            input[type="text"] {
                width: 100%;
            }
            select, input[type="submit"], .add-link-form input {
                width: 100%;
            }
            .links a {
                display: inline-block;
                margin: 6px 8px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <img src="favicon/android-chrome-192x192.png" alt="Simple Web Homepage Logo" />
    <h1>Simple Web Homepage</h1>
    <!--<h3>Start exploring the web now!</h3>-->
	<h3>Currently undergoing a rebranding.<br>Formerly "Edgescape Navigator Homepage"</h3>

    <!-- Search Form -->
    <div class="search-form">
        <form id="searchForm" method="get">
            <select id="searchEngine" onchange="updatePlaceholder()">
                <option value="bing">Bing</option>
                <option value="brave">Brave</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="ecosia">Ecosia</option>
                <option value="google">Google</option>
                <option value="lycos">Lycos</option>
                <option value="searxng">SearXNG</option>
                <option value="wikipedia">Wikipedia</option>
                <option value="yahoo">Yahoo</option>
				<option value="youtube">YouTube</option>
            </select>

            <input type="text" id="searchQuery" placeholder="Search" autocomplete="off" />
            <input type="submit" value="Search" />
        </form>
    </div>

    <div id="linksContainer" class="links"></div>

    <div class="add-link-button-container">
        <button class="add-link-button" onclick="showAddLinkPopup()">+</button>
    </div>

    <div class="add-link-popup" id="addLinkPopup">
        <div class="add-link-popup-content">
            <h3>Add a New Link</h3>
            <div id="errorMessage" style="color:red;display:none"></div>
            <input type="text" id="newLinkName" placeholder="Name">
            <input type="text" id="newLinkUrl" placeholder="URL">
            <button onclick="addLink()">Add Link</button>
        </div>
    </div>

    <div class="footer">
        The Edgescape Navigator Browser Homepage<br>
		Version 2026.05.25 (R31)<br>
        ©TheDoggyBrad Software Labs. All Rights Reserved.
    </div>
</div>

<script>
const engines = {
    google: ["https://www.google.com/search", "q", "Search with Google"],
    duckduckgo: ["https://duckduckgo.com/", "q", "Search with DuckDuckGo"],
    bing: ["https://www.bing.com/search", "q", "Search with Bing"],
    searxng: ["https://thesearxng.vercel.app/search", "q", "Search with SearXNG"],
    wikipedia: ["https://en.wikipedia.org/w/index.php", "search", "Search Wikipedia"],
    ecosia: ["https://www.ecosia.org/search", "q", "Search with Ecosia"],
    brave: ["https://search.brave.com/search", "q", "Search with Brave"],
    lycos: ["https://search.lycos.com/web/", "q", "Search with Lycos"],
    yahoo: ["https://search.yahoo.com/search", "p", "Search with Yahoo"],
	youtube: ["https://www.youtube.com/results", "search_query", "Search with YouTube"]
};

function updatePlaceholder() {
    const engine = document.getElementById("searchEngine").value;
    const [action, param, placeholder] = engines[engine];

    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("searchQuery");

    form.action = action;
    queryInput.name = param;
    queryInput.placeholder = placeholder;

    localStorage.setItem("selectedEngine", engine);
}

window.addEventListener("load", () => {
    const dropdown = document.getElementById("searchEngine");
    const saved = localStorage.getItem("selectedEngine");

    if (saved) {
        dropdown.value = saved;
    } else {
        dropdown.value = "google"; // default on first load
    }

    updatePlaceholder();
});


function loadLinks() {
    const cookies = document.cookie.split(';');
    const links = cookies.find(c => c.startsWith("links="));
    if (links) {
        const data = JSON.parse(decodeURIComponent(links.split("=")[1]));
        data.forEach(link => displayLink(link.name, link.url));
    }
}

window.onclick = function(event) {
    const popup = document.getElementById('addLinkPopup');
    if (event.target === popup) {
    	popup.style.display = 'none';
    }
}

function saveLinks() {
    const links = [];
    document.querySelectorAll(".link-item").forEach(item => {
        const a = item.querySelector("a");
        links.push({ name: a.textContent, url: a.href });
    });
    document.cookie = `links=${encodeURIComponent(JSON.stringify(links))}; path=/; max-age=3155760000`;
}

function displayLink(name, url) {
    const div = document.createElement("div");
    div.classList.add("link-item");
    div.innerHTML = `<a href="${url}">${name}</a><button class="remove-button">Remove</button>`;
    div.oncontextmenu = e => {
        e.preventDefault();
        div.querySelector(".remove-button").style.display = "inline-block";
    };
    div.querySelector(".remove-button").onclick = () => {
        div.remove();
        saveLinks();
    };
    document.getElementById("linksContainer").appendChild(div);
}

function showAddLinkPopup() {
    document.getElementById("addLinkPopup").style.display = "flex";
}

function addLink() {
    const name = newLinkName.value;
    const url = newLinkUrl.value;

    if (!/^https?:\/\//.test(url)) {
        errorMessage.textContent = "URL must start with http:// or https://";
        errorMessage.style.display = "block";
        return;
    }

    errorMessage.style.display = "none";
    displayLink(name, url);
    saveLinks();

    addLinkPopup.style.display = "none";
    newLinkName.value = "";
    newLinkUrl.value = "";
}

window.onload = loadLinks;
</script>

</body>
</html>
