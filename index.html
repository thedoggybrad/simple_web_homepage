<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edgescape Navigator - Homepage</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        h3 {
            font-weight: 400;
            color: #666;
            margin-bottom: 30px;
        }

        .search-form form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        select, input[type="text"], input[type="submit"] {
            padding: 10px;
            font-size: 1em;
            border-radius: 6px;
            border: 1px solid #ccc;
            transition: all 0.2s ease-in-out;
        }

        select {
            width: 150px;
            background-color: #f0f8ff;
            border-color: #4CAF50;
            cursor: pointer;
        }

        input[type="text"] {
            width: 60%;
            min-width: 200px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .links {
            margin-top: 30px;
        }

        .links a {
            margin: 6px 12px;
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: #388e3c;
            text-decoration: underline;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #888;
            line-height: 1.6;
        }

        @media (max-width: 500px) {
            input[type="text"] {
                width: 100%;
            }
            select, input[type="submit"] {
                width: 100%;
            }
            .links a {
                display: inline-block;
                margin: 6px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Edgescape Logo" />
        <h1>Edgescape Navigator</h1>
        <h3>Start exploring the web now!</h3>

        <div class="search-form">
            <form id="searchForm" action="https://www.google.com/search" method="get">
                <select id="searchEngine" onchange="updatePlaceholder()">
                    <option value="bing">Bing</option>
                    <option value="brave">Brave</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="ecosia">Ecosia</option>
                    <option value="google" selected>Google</option>
                    <option value="lycos">Lycos</option>
                    <option value="searxng">SearXNG</option>
                    <option value="wikipedia">Wikipedia</option>
                    <option value="yahoo">Yahoo</option>
                </select>
                <input type="text" id="searchQuery" name="q" placeholder="Search with Google" />
                <input type="submit" value="Search" />
            </form>
        </div>

        <div class="links">
            <a href="https://www.youtube.com">YouTube</a>
            <a href="https://www.wikipedia.org">Wikipedia</a>
            <a href="https://www.reddit.com">Reddit</a>
            <a href="https://chatgpt.com">ChatGPT</a><br>
            <a href="https://www.facebook.com">Facebook</a>
            <a href="https://www.instagram.com">Instagram</a>
            <a href="https://x.com">X (Twitter)</a>
            <a href="https://mail.google.com">Gmail</a><br>
            <a href="https://www.britannica.com/">Britannica</a>
            <a href="https://medlineplus.gov/">MedlinePlus</a>
            <a href="https://www.merriam-webster.com/">Merriam-Webster</a>
            <a href="https://www.accuweather.com/">AccuWeather</a>
        </div>

        <div class="footer">
            <p>
                Edgescape Navigator Startpage<br />
                Version 1.5<br />
                &copy;TheDoggyBrad Software Labs. All Rights Reserved.
            </p>
        </div>
    </div>

    <script>
        function updatePlaceholder() {
            const searchEngine = document.getElementById("searchEngine").value;
            const searchQuery = document.getElementById("searchQuery");
            const form = document.getElementById("searchForm");

            const engines = {
                google: ["https://www.google.com/search", "q", "Search with Google"],
                duckduckgo: ["https://duckduckgo.com/", "q", "Search with DuckDuckGo"],
                bing: ["https://www.bing.com/search", "q", "Search with Bing"],
                searxng: ["https://farside.link/searxng/search", "q", "Search with SearXNG"],
                wikipedia: ["https://en.wikipedia.org/w/index.php", "search", "Search Wikipedia"],
                ecosia: ["https://www.ecosia.org/search", "q", "Search with Ecosia"],
                brave: ["https://search.brave.com/search", "q", "Search with Brave"],
                lycos: ["https://search.lycos.com/web/", "q", "Search with Lycos"],
                yahoo: ["https://search.yahoo.com/search", "p", "Search with Yahoo"]
            };

            const [action, name, placeholder] = engines[searchEngine] || engines.google;

            form.action = action;
            searchQuery.name = name;
            searchQuery.placeholder = placeholder;
        }

        window.onload = updatePlaceholder;
    </script>
</body>
</html>
